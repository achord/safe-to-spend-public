<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returning to SafeToSpend…</title>
<link rel="icon" href="./favicon.png" type="image/png">
<style>
  :root{
    --bg:#fbfaf8; --ink:#1a1a19; --muted:#6b6b66; --line:#e5e3de; --accent:#1f6f4f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131413; --ink:#eceae6; --muted:#9a9a94; --line:#2b2c2b; --accent:#6dbf97; }
  }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); text-align:center; padding:24px;
    font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  .box{max-width:420px}
  .dot{
    width:12px;height:12px;border-radius:50%;background:var(--accent);
    margin:0 auto 24px; animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  h1{font-size:19px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:15px;margin:0 0 20px}
  a.btn{
    display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:9px;
    color:var(--accent);text-decoration:none;font-size:14px;font-weight:500;
  }
  a.btn:hover{border-color:var(--accent)}
  .hide{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="dot"></div>
  <h1>Finishing your bank connection</h1>
  <p id="msg">Handing you back to SafeToSpend…</p>
  <a id="manual" class="btn hide" href="#">Open SafeToSpend</a>
</div>

<script>
  // Plaid redirects here after the bank's OAuth screen. This page runs on a public
  // HTTPS origin because Plaid requires one; the app itself runs locally. So all we
  // do is hand the full redirect URL back to the local app, which re-opens Link with
  // it as `receivedRedirectUri`.

  // Change this if your dev server uses a different port.
  var LOCAL_APP = 'http://localhost:5173/oauth';

  var target = LOCAL_APP + '?received_redirect_uri=' + encodeURIComponent(window.location.href);

  var manual = document.getElementById('manual');
  manual.href = target;

  // If the app isn't running, the navigation fails silently — so show a manual link
  // shortly after, rather than leaving the user on a spinner forever.
  setTimeout(function () {
    document.getElementById('msg').textContent =
      'If nothing happened, make sure SafeToSpend is running, then continue.';
    manual.classList.remove('hide');
  }, 2500);

  window.location.replace(target);
</script>
</body>
</html>
